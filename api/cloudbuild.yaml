# =============================================================================
# cloudbuild.yaml
# =============================================================================
# Builds the Docker image, pushes to Artifact Registry, and deploys to
# Cloud Run in project options-trader-493420.
#
# Trigger manually or via a Cloud Build trigger on push to main.
#
# Required Cloud Build substitution variables (set in trigger settings):
#   _REGION         — e.g. us-central1
#   _SERVICE        — e.g. swing-options-api
#   _ARTIFACT_REPO  — e.g. swing-options-api  (Artifact Registry repo name)
#
# Required Secret Manager secrets (referenced as env vars at runtime):
#   SUPABASE_URL
#   SUPABASE_SERVICE_KEY
#   SUPABASE_ANON_KEY
#   PYTHON_API_SECRET
# =============================================================================

serviceAccount: projects/options-trader-493420/serviceAccounts/89270877238-compute@developer.gserviceaccount.com

substitutions:
  _REGION: us-central1
  _SERVICE: swing-options-api
  _ARTIFACT_REPO: swing-options-api
  # _TAG is overridden by deploy.sh (git short-SHA) or left as "latest" for
  # trigger-based builds that set COMMIT_SHA separately.
  _TAG: latest

steps:
  # ── 1. Build Docker image ──────────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_SERVICE}:${_TAG}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_SERVICE}:latest
      - ./api
    dir: .

  # ── 2. Push to Artifact Registry ──────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_SERVICE}

  # ── 3. Deploy to Cloud Run ─────────────────────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_SERVICE}:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --memory=512Mi
      - --cpu=2
      # Concurrency must stay low: every hot endpoint (/iv/snapshot, /sabr/*,
      # /heston/*, the /jobs/* pulls) is CPU-bound numpy/scipy, so Cloud Run's
      # default of 80 packed the scheduled jobs and interactive browser traffic
      # onto one instance and never scaled out. Observed 2026-08-19: a 58s
      # greek-grid-pull starved /iv/snapshot to 86s and even the CORS preflight
      # to 10.9s, past the Dart client's 30s timeout. 2 vCPU x 2 requests gives
      # each in-flight request a core of its own before a new instance spins up.
      - --concurrency=2
      # min-instances=1 keeps one container warm. At 0 the first request after a
      # quiet period paid a ~14s cold start (observed 2026-08-10 on /health),
      # which the hourly scheduler cycle hides but a browser hitting the API
      # directly does not.
      - --min-instances=1
      # Raised from 3 alongside the concurrency drop — at 2 requests per
      # instance the old ceiling capped the service at 6 in-flight requests.
      - --max-instances=10
      - --timeout=3600
      - --set-secrets=SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_SERVICE_KEY=SUPABASE_SERVICE_KEY:latest,SUPABASE_ANON_KEY=SUPABASE_ANON_KEY:latest,PYTHON_API_SECRET=PYTHON_API_SECRET:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_SERVICE}:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_SERVICE}:latest

# REGIONAL_USER_OWNED_BUCKET satisfies the custom-service-account logging
# requirement deterministically; CLOUD_LOGGING_ONLY was accepted or rejected
# at random by build validation (observed 2026-07-16) and conflicts with any
# explicit --gcs-log-dir.
options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
